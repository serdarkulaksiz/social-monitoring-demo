name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.13 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Repository hygiene (forbidden files and secrets)
        run: python scripts/check_repo.py

      - name: Verify no .pytest_cache before tests
        run: python scripts/run_tests.py --check-only

      - name: Run tests without cache or bytecode
        run: python scripts/run_tests.py -v

      - name: Verify no .pytest_cache after tests
        run: python -c "import pathlib, sys; found = [str(p) for p in pathlib.Path('.').rglob('.pytest_cache')]; print('found:', found); sys.exit(1 if found else 0)"
